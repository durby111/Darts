<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
<meta charset="UTF-8">
<title>X01 Concept 4 — Split Thumb</title>
<link rel="stylesheet" href="_proto.css">
<style>
/* ============================================
   CONCEPT 4 — "SPLIT THUMB"
   Ergonomics first: a tablet is held in two hands.
   ============================================
   Thesis: on a 744-wide slate the centre of the screen is the hardest
   place to reach and the easiest place to read. Every concept so far puts
   the keypad there, forcing a one-handed reach across glass. Split Thumb
   mirrors the controls into two thumb arcs at the bottom corners and
   leaves the whole middle column free for information.

   Left thumb owns digits, right thumb owns commits and quick scores, so
   the two hands never contend for the same target.
   ============================================ */

.st-head {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--space-md);
    padding: var(--space-md) var(--space-lg);
    background: var(--color-surface-alt);
    border-bottom: 1px solid var(--color-border);
}

.st-p { text-align: center; padding: var(--space-sm); border-radius: var(--radius-lg); min-width: 0; }

.st-p.active {
    background: color-mix(in srgb, var(--color-primary) 18%, transparent);
    box-shadow: inset 0 0 0 2px var(--color-primary);
}

.st-nm { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-text-muted); }
.st-p.active .st-nm { color: var(--color-primary-light); }
.st-sc { font-size: 72px; font-weight: 800; line-height: 1; }
.st-dl { font-size: 18px; font-weight: 700; color: var(--color-pending); min-height: 22px; }
.st-av { font-size: 11px; letter-spacing: 0.1em; color: var(--color-text-dim); }

.st-mid-head { text-align: center; }
.st-mid-head .rd { font-size: 28px; font-weight: 800; line-height: 1; }
.st-mid-head small { font-size: 10px; letter-spacing: 0.16em; color: var(--color-text-dim); }
.st-mid-head button {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    padding: 5px 12px;
    border: 1px solid var(--color-border-light);
    border-radius: var(--radius-pill);
    color: var(--color-text-muted);
}

/* --- Information column --- */
.st-body {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 54px 1fr;
    min-height: 0;
    overflow: hidden;
}

.st-lane { display: flex; flex-direction: column; justify-content: flex-end; overflow-y: auto; scrollbar-width: none; }
.st-lane.n { background: rgba(255,255,255,0.03); border-inline: 1px solid var(--color-border); }

.st-c { min-height: 46px; display: flex; align-items: center; justify-content: center; font-size: 29px; font-weight: 700; color: var(--color-text-dim); }
.st-lane .st-c:nth-last-child(-n+2) { color: var(--color-text); }
.st-c.n { font-size: 13px; font-weight: 800; }
.st-c.n.cur { color: var(--color-on-primary); }
.st-c.n.cur span { background: var(--color-primary); border-radius: var(--radius-pill); padding: 3px 9px; }
.st-c.bust { font-size: 15px; color: var(--color-danger); }
.st-c.live { color: var(--color-primary-light); }

.st-out {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: color-mix(in srgb, var(--color-primary) 16%, transparent);
    border-block: 1px solid color-mix(in srgb, var(--color-primary) 40%, transparent);
}

.st-out small { font-size: 11px; letter-spacing: 0.14em; color: var(--color-primary-light); }
.st-out b { font-size: 22px; letter-spacing: 0.12em; }

/* --- Thumb decks --- */
.st-decks {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-md);
    padding: var(--space-md);
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.5));
}

.st-deck {
    border-radius: 28px;
    padding: var(--space-md);
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
}

.st-deck-lb { font-size: 10px; letter-spacing: 0.18em; color: var(--color-text-dim); text-align: center; }

/* Fill the deck: the digit pad has fewer rows than the right-hand deck, so
   without this the left thumb gets a short pad and a dead gap. */
.st-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 7px; flex: 1 1 auto; min-height: 0; }

.st-key {
    border-radius: 18px;
    background: linear-gradient(180deg, var(--color-surface-elevated), var(--color-surface-alt));
    border: 1px solid var(--color-border-light);
    font-size: 26px;
    font-weight: 700;
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
}

.st-key.op { color: var(--color-primary-light); background: color-mix(in srgb, var(--color-primary) 24%, var(--color-surface-elevated)); }

.st-quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

.st-quick button {
    height: 40px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--color-primary) 20%, var(--color-surface));
    border: 1px solid color-mix(in srgb, var(--color-primary) 42%, transparent);
    color: var(--color-primary-light);
    font-size: 14px;
    font-weight: 800;
}

.st-commit { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

.st-commit button {
    height: 58px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.1em;
    box-shadow: 0 2px 0 rgba(0,0,0,0.5);
}

.st-commit .undo  { background: var(--color-undo); color: #fff; }
.st-commit .miss  { background: var(--color-miss); color: #fff; }
.st-commit .bust  { background: var(--color-bust); color: #fff; }
.st-commit .enter { background: var(--color-success); color: var(--color-on-success); }
.st-commit .wide  { grid-column: span 2; height: 66px; font-size: 18px; }

/* Display bridges the two decks so both thumbs see it. */
.st-display {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--space-md);
    padding: 0 var(--space-md);
}

.st-display .rule { height: 1px; background: var(--color-border); }

.st-display .val {
    font-size: 48px;
    font-weight: 800;
    padding: 4px 34px;
    border-radius: var(--radius-pill);
    background: var(--color-surface-alt);
    border: 2px solid var(--color-primary);
    color: var(--color-primary-light);
}
</style>
</head>
<body>
<div class="proto-app">

    <div class="st-head">
        <div class="st-p active">
            <div class="st-nm">Blake</div>
            <div class="st-sc tnum">170</div>
            <div class="st-dl tnum">&minus;60</div>
            <div class="st-av">AVG 62.4 &middot; 18 DARTS</div>
        </div>
        <div class="st-mid-head">
            <small>ROUND</small>
            <div class="rd tnum">7</div>
            <button>MENU</button>
        </div>
        <div class="st-p">
            <div class="st-nm">Mike</div>
            <div class="st-sc tnum">275</div>
            <div class="st-dl"></div>
            <div class="st-av">AVG 51.8 &middot; 18 DARTS</div>
        </div>
    </div>

    <div class="st-body">
        <div class="st-lane" id="laneL"></div>
        <div class="st-lane n" id="laneR"></div>
        <div class="st-lane" id="laneM"></div>
    </div>

    <div class="st-out">
        <small>CHECKOUT 170</small>
        <b>T20 &middot; T20 &middot; BULL</b>
    </div>

    <div class="st-display">
        <div class="rule"></div>
        <div class="val tnum">60</div>
        <div class="rule"></div>
    </div>

    <div class="st-decks">
        <div class="st-deck">
            <div class="st-deck-lb">DIGITS</div>
            <div class="st-grid3">
                <button class="st-key">1</button><button class="st-key">2</button><button class="st-key">3</button>
                <button class="st-key">4</button><button class="st-key">5</button><button class="st-key">6</button>
                <button class="st-key">7</button><button class="st-key">8</button><button class="st-key">9</button>
                <button class="st-key op">&times;</button><button class="st-key">0</button><button class="st-key op">+</button>
            </div>
        </div>

        <div class="st-deck">
            <div class="st-deck-lb">QUICK SCORES</div>
            <div class="st-quick">
                <button>26</button><button>40</button><button>41</button><button>45</button><button>60</button>
            </div>
            <div class="st-quick">
                <button>81</button><button>85</button><button>100</button><button>140</button><button>180</button>
            </div>
            <div class="st-deck-lb" style="margin-top:2px;">COMMIT</div>
            <div class="st-commit">
                <button class="undo">UNDO</button><button class="miss">MISS</button>
                <button class="bust">BUST</button><button class="miss" style="background:var(--color-surface-elevated);">REDO</button>
                <button class="enter wide">ENTER 60</button>
            </div>
        </div>
    </div>
</div>

<div class="proto-tag">Concept 4 &middot; Split Thumb</div>

<script>
const L = [60, 81, 45, 26, 60, 59];
const M = [41, 60, 26, 'BUST', 45, 54];
const c = (v, e = '') => `<div class="st-c ${v === 'BUST' ? 'bust' : ''} ${e}">${v}</div>`;
document.getElementById('laneL').innerHTML = L.map(v => c(v)).join('') + c(60, 'live');
document.getElementById('laneM').innerHTML = M.map(v => c(v)).join('') + c('&nbsp;');
document.getElementById('laneR').innerHTML = Array.from({ length: 7 }, (_, i) =>
    `<div class="st-c n${i === 6 ? ' cur' : ''}"><span>${i + 1}</span></div>`).join('');
</script>
</body>
</html>
