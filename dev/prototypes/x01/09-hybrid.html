<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X01 Concept 9 - Hybrid Total Entry</title>
<link rel="stylesheet" href="_hybrid.css">
</head>
<body>
<div class="proto-app">
    <header class="hy-bar">
        <div class="hy-game">501 <small>&middot; DOUBLE OUT</small></div>
        <div class="hy-round"><small>ROUND</small><b class="tnum">7</b></div>
        <button class="hy-menu">MENU</button>
    </header>

    <main class="hy-stack">
        <section class="hy-card active">
            <div>
                <div class="hy-badge">NOW THROWING</div>
                <div class="hy-name">BLAKE</div>
                <div class="hy-legs">LEGS &nbsp;&#9679;&#9679;&#9675;&#9675;&#9675;</div>
            </div>
            <div class="hy-big">
                <b class="tnum" id="activeScore">170</b>
                <span class="hy-proj tnum" id="activeProjection">&minus;60 &rarr; 110</span>
            </div>
            <div class="hy-cardfoot">
                <div class="hy-checkout">
                    <small>170 CHECKOUT</small>
                    <div class="hy-route"><span>T20</span><span>T20</span><span>BULL</span></div>
                </div>
                <div class="hy-legstats">
                    <div><b class="tnum">62.4</b><small>3-DART</small></div>
                    <div><b class="tnum">6</b><small>VISITS</small></div>
                    <div><b class="tnum">1</b><small>180s</small></div>
                    <div class="na"><b>&mdash;</b><small>CHECKOUT</small></div>
                </div>
                <button class="hy-bust" id="bustBtn">BUST</button>
            </div>
        </section>

        <section class="hy-card" data-player="mike">
            <div class="hy-rank">2</div>
            <div>
                <div class="hy-name">MIKE</div>
                <div class="hy-meta">AVG 51.8 &middot; 6 VISITS</div>
            </div>
            <div class="hy-last">LAST<b class="tnum">54</b></div>
            <div class="hy-rem tnum">275</div>
        </section>
    </main>

    <section class="hy-tape" aria-label="Visit history">
        <div class="hy-taperow rail">
            <div class="lbl">ROUND</div>
            <div class="hy-cells">
                <div class="hy-cell">1</div><div class="hy-cell">2</div><div class="hy-cell">3</div>
                <div class="hy-cell">4</div><div class="hy-cell">5</div><div class="hy-cell">6</div>
                <div class="hy-cell cur">7</div>
            </div>
        </div>
        <div class="hy-taperow live">
            <div class="lbl">BLAKE</div>
            <div class="hy-cells">
                <button class="hy-cell" data-total="60">60</button>
                <button class="hy-cell" data-total="81">81</button>
                <button class="hy-cell" data-total="45">45</button>
                <button class="hy-cell" data-total="26">26</button>
                <button class="hy-cell" data-total="60">60</button>
                <button class="hy-cell open" data-total="59">59<span class="hy-detail"><em>DARTS NOT CAPTURED</em></span></button>
                <div class="hy-cell cur">60</div>
            </div>
        </div>
        <div class="hy-taperow">
            <div class="lbl">MIKE</div>
            <div class="hy-cells">
                <button class="hy-cell" data-total="41">41</button>
                <button class="hy-cell" data-total="60">60</button>
                <button class="hy-cell" data-total="26">26</button>
                <button class="hy-cell bust" data-total="0">BUST</button>
                <button class="hy-cell" data-total="45">45</button>
                <button class="hy-cell" data-total="54">54</button>
                <div class="hy-cell empty">&mdash;</div>
            </div>
        </div>
    </section>

    <section class="hy-deck">
        <div class="hy-modes" role="group" aria-label="Score entry mode">
            <button class="on" data-mode="total">TURN TOTAL</button>
            <button data-mode="remaining">SCORE LEFT</button>
        </div>
        <div class="hy-hint" id="entryHint">BLAKE &middot; TURN TOTAL</div>

        <div class="hy-inputrow">
            <div class="hy-display"><b id="scoreInput">60</b><i id="scoreResult">&rarr; 110</i></div>
            <button class="hy-back" id="backspaceBtn" aria-label="Backspace">&#9003;</button>
        </div>

        <div class="hy-quick" aria-label="Quick scores">
            <button data-quick="26">26</button><button data-quick="40">40</button>
            <button data-quick="41">41</button><button data-quick="45">45</button>
            <button data-quick="60">60</button><button data-quick="81">81</button>
            <button data-quick="85">85</button><button data-quick="100">100</button>
            <button data-quick="140">140</button><button data-quick="180">180</button>
        </div>

        <div class="hy-pad">
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="sm undo" id="undoBtn">UNDO</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button class="sm miss" id="missBtn">MISS</button>
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="hy-enter" id="enterBtn"><b>ENTER</b><span>60</span></button>
            <button class="op" data-key="&times;">&times;</button><button data-key="0">0</button><button class="op" data-key="+">+</button>
        </div>
    </section>
</div>

<div class="proto-tag">Concept 9 &middot; Hybrid &middot; Total Entry</div>

<script>
const currentScore = 170;
let expression = '60';
let mode = 'total';

const input = document.getElementById('scoreInput');
const result = document.getElementById('scoreResult');
const projection = document.getElementById('activeProjection');
const enterValue = document.querySelector('#enterBtn span');
const hint = document.getElementById('entryHint');

function totalFor(value) {
    if (!value || !/^[0-9+\u00d7]+$/.test(value)) return 0;
    return value.split('+').reduce((sum, term) => {
        const product = term.split('\u00d7').reduce((part, token) => part * Number(token || 0), 1);
        return sum + product;
    }, 0);
}

function render() {
    const entered = totalFor(expression);
    const total = mode === 'remaining' ? Math.max(0, currentScore - entered) : entered;
    const scoreLeft = mode === 'remaining' ? entered : currentScore - total;
    const invalid = total > 180 || scoreLeft < 0 || !expression;

    input.textContent = expression || '0';
    result.textContent = invalid ? 'BUST' : `\u2192 ${scoreLeft}`;
    result.style.color = invalid ? 'var(--color-danger)' : '';
    projection.textContent = invalid ? 'BUST' : `\u2212${total} \u2192 ${scoreLeft}`;
    projection.classList.toggle('bustproj', invalid);
    enterValue.textContent = mode === 'remaining' ? entered : total;
    hint.textContent = `BLAKE \u00b7 ${mode === 'remaining' ? 'SCORE LEFT' : 'TURN TOTAL'}`;
}

function setExpression(value) {
    expression = String(value);
    render();
}

document.querySelectorAll('[data-key]').forEach(button => {
    button.addEventListener('click', () => {
        const key = button.dataset.key;
        if (expression === '0' && /^\d$/.test(key)) expression = '';
        if (/^[+\u00d7]$/.test(key) && (!expression || /[+\u00d7]$/.test(expression))) return;
        expression += key;
        render();
    });
});

document.querySelectorAll('[data-quick]').forEach(button => {
    button.addEventListener('click', () => setExpression(button.dataset.quick));
});

document.querySelectorAll('[data-mode]').forEach(button => {
    button.addEventListener('click', () => {
        mode = button.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach(item => item.classList.toggle('on', item === button));
        expression = mode === 'remaining' ? '110' : '60';
        render();
    });
});

document.getElementById('backspaceBtn').addEventListener('click', () => {
    expression = expression.slice(0, -1);
    render();
});

document.getElementById('missBtn').addEventListener('click', () => setExpression(0));
document.getElementById('undoBtn').addEventListener('click', () => setExpression(59));
document.getElementById('bustBtn').addEventListener('click', () => {
    expression = '';
    input.textContent = 'BUST';
    result.textContent = 'NO SCORE';
    projection.textContent = 'BUST \u2192 170';
    projection.classList.add('bustproj');
    enterValue.textContent = '0';
});

document.querySelectorAll('.hy-cell[data-total]').forEach(cell => {
    cell.addEventListener('click', () => {
        document.querySelectorAll('.hy-cell.open').forEach(item => item.classList.remove('open'));
        cell.classList.add('open');
        if (!cell.querySelector('.hy-detail')) {
            const detail = document.createElement('span');
            detail.className = 'hy-detail';
            detail.innerHTML = '<em>DARTS NOT CAPTURED</em>';
            cell.append(detail);
        }
        mode = 'total';
        document.querySelectorAll('[data-mode]').forEach(item =>
            item.classList.toggle('on', item.dataset.mode === mode));
        setExpression(cell.dataset.total);
    });
});

render();
</script>
</body>
</html>
