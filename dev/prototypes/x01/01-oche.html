<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X01 Concept 1 — Oche</title>
<link rel="stylesheet" href="_proto.css">
<style>
/* ============================================
   CONCEPT 1 — "OCHE"
   Board-first, per-dart entry.
   ============================================
   Thesis: the scorer already knows where the dart landed, so make them
   point at it instead of doing mental arithmetic. Tapping T20 T20 BULL is
   three taps and zero maths; the current pad needs 2*20+2*20+50 = eleven.
   Per-dart data also unlocks real checkout tracking and dart-level undo.

   The keypad survives as a one-tap fallback (the 123 toggle) for people
   scoring for someone else across the room.
   ============================================ */

.oche-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: var(--space-sm);
    padding: var(--space-sm) var(--space-md);
    background: var(--color-surface-alt);
    border-bottom: 1px solid var(--color-border);
    flex: 0 0 auto;
}

.oche-player {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-lg);
    border: 2px solid transparent;
    min-width: 0;
}

.oche-player.active {
    border-color: var(--color-primary);
    background: color-mix(in srgb, var(--color-primary) 16%, transparent);
}

.oche-name {
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
}

.oche-player.active .oche-name {
    color: var(--color-primary-light);
}

.oche-remaining {
    font-size: 78px;
    font-weight: 800;
    line-height: 1;
}

.oche-sub {
    display: flex;
    gap: var(--space-md);
    font-size: 12px;
    color: var(--color-text-dim);
    margin-top: 2px;
}

.oche-delta {
    font-size: 20px;
    font-weight: 700;
    color: var(--color-pending);
    min-height: 24px;
}

.oche-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.oche-menu {
    font-size: 12px;
    letter-spacing: 0.08em;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--color-border-light);
    color: var(--color-text-muted);
}

.oche-round {
    font-size: 13px;
    color: var(--color-text-muted);
}

.oche-round b {
    color: var(--color-text);
    font-size: 20px;
}

/* --- Body: score tape beside the board --- */
.oche-body {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 208px minmax(0, 1fr);
    min-height: 0;
}

.oche-tape {
    display: grid;
    grid-template-columns: 1fr 38px 1fr;
    /* Explicit rows: with auto rows the grid's default align-content:stretch
       split the slack between the header and the lanes, stranding the tape
       in the middle of the column. */
    grid-template-rows: auto minmax(0, 1fr);
    border-right: 1px solid var(--color-border);
    background: color-mix(in srgb, var(--color-surface) 45%, transparent);
    overflow: hidden;
}

.oche-tape-head {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--color-text-dim);
    text-align: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--color-border);
}

/* Bottom-anchored: the newest visit is the one that matters, so it stays
   pinned above the fold as the leg grows. */
.oche-lane {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow-y: auto;
    scrollbar-width: none;
}

.oche-lane.rounds {
    background: color-mix(in srgb, var(--color-bg) 40%, transparent);
}

.oche-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    font-size: 26px;
    font-weight: 700;
    color: var(--color-text-muted);
}

.oche-lane .oche-cell:nth-last-child(-n+2) {
    color: var(--color-text);
}

.oche-cell.rd {
    font-size: 13px;
    font-weight: 700;
    color: var(--color-text-dim);
}

.oche-cell.rd.current {
    color: var(--color-on-primary);
}

.oche-cell.rd.current span {
    background: var(--color-primary);
    border-radius: var(--radius-pill);
    padding: 3px 9px;
}

.oche-cell.bust {
    font-size: 15px;
    color: var(--color-danger);
    letter-spacing: 0.06em;
}

.oche-cell.miss {
    font-size: 15px;
    color: var(--color-text-dim);
}

.oche-cell.live {
    color: var(--color-primary-light);
}

/* --- Board column --- */
.oche-boardcol {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: var(--space-sm) var(--space-md) 0;
    gap: var(--space-sm);
}

.oche-checkout {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg,
        color-mix(in srgb, var(--color-primary) 32%, transparent),
        color-mix(in srgb, var(--color-primary) 12%, transparent));
    border: 1px solid color-mix(in srgb, var(--color-primary) 45%, transparent);
}

.oche-checkout .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-primary-light);
}

.oche-route {
    display: flex;
    gap: 6px;
}

.oche-route span {
    font-size: 19px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: var(--radius-md);
    background: var(--color-primary);
    color: var(--color-on-primary);
}

.oche-route span.done {
    background: transparent;
    color: var(--color-text-dim);
    text-decoration: line-through;
}

/* Three dart slots — the running turn, always visible. */
.oche-darts {
    display: grid;
    grid-template-columns: repeat(3, 1fr) auto;
    gap: var(--space-sm);
    align-items: stretch;
}

.oche-dart {
    height: 56px;
    border-radius: var(--radius-lg);
    border: 2px dashed var(--color-border-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    color: var(--color-text-dim);
}

.oche-dart.filled {
    border-style: solid;
    border-color: var(--color-primary);
    background: color-mix(in srgb, var(--color-primary) 22%, transparent);
    color: var(--color-text);
}

.oche-turntotal {
    min-width: 96px;
    border-radius: var(--radius-lg);
    background: var(--color-surface-elevated);
    border: 1px solid var(--color-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.oche-turntotal small {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--color-text-dim);
}

.oche-turntotal b {
    font-size: 28px;
}

.oche-boardwrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
}

.oche-boardwrap svg {
    width: 100%;
    height: 100%;
    max-height: 100%;
}

.seg-single-a { fill: #0f0f0f; }
.seg-single-b { fill: #e8dcc0; }
.seg-mult-a   { fill: #167d3b; }
.seg-mult-b   { fill: #c8102e; }
.seg-line     { stroke: #000; stroke-width: 1; }
.board-num    { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }

/* A circle in a tall box always leaves vertical slack — spend it on the
   quick scores rather than on emptiness. */
.oche-quick {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding-bottom: var(--space-sm);
}

.oche-quick button {
    height: 42px;
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--color-primary) 20%, var(--color-surface));
    border: 1px solid color-mix(in srgb, var(--color-primary) 42%, transparent);
    color: var(--color-primary-light);
    font-size: 15px;
    font-weight: 800;
}

/* --- Footer actions --- */
.oche-footer {
    flex: 0 0 auto;
    padding: var(--space-sm) var(--space-md) var(--space-md);
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
    background: var(--color-surface-alt);
    border-top: 1px solid var(--color-border);
}

.oche-finish {
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--color-text-muted);
    min-height: 17px;
}

.oche-actions {
    display: grid;
    grid-template-columns: 74px 74px 1fr 1fr 1.4fr;
    gap: var(--space-sm);
}

.oche-btn {
    height: 62px;
    border-radius: var(--radius-lg);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--color-border-light);
    background: var(--color-surface-elevated);
    color: var(--color-text);
}

.oche-btn.undo { background: var(--color-undo); border-color: transparent; color: #fff; font-size: 12px; }
.oche-btn.pad  { background: var(--color-surface); font-size: 20px; }
.oche-btn.miss { background: var(--color-miss); border-color: transparent; }
.oche-btn.bust { background: var(--color-bust); border-color: transparent; }
.oche-btn.enter{ background: var(--color-success); border-color: transparent; color: var(--color-on-success); font-size: 19px; }
</style>
</head>
<body>
<div class="proto-app">

    <div class="oche-header">
        <div class="oche-player active">
            <div class="oche-name">Blake</div>
            <div class="oche-remaining tnum">170</div>
            <div class="oche-delta tnum">&minus;60</div>
            <div class="oche-sub"><span>avg 62.4</span><span>18 darts</span></div>
        </div>
        <div class="oche-center">
            <button class="oche-menu">MENU</button>
            <div class="oche-round">Round <b class="tnum">7</b></div>
        </div>
        <div class="oche-player">
            <div class="oche-name">Mike</div>
            <div class="oche-remaining tnum">275</div>
            <div class="oche-delta tnum"></div>
            <div class="oche-sub"><span>avg 51.8</span><span>18 darts</span></div>
        </div>
    </div>

    <div class="oche-body">
        <div class="oche-tape">
            <div class="oche-tape-head">Blake</div>
            <div class="oche-tape-head">#</div>
            <div class="oche-tape-head">Mike</div>

            <div class="oche-lane" id="laneL"></div>
            <div class="oche-lane rounds" id="laneR"></div>
            <div class="oche-lane" id="laneM"></div>
        </div>

        <div class="oche-boardcol">
            <div class="oche-checkout">
                <span class="label">Checkout 170</span>
                <div class="oche-route">
                    <span class="done">T20</span><span>T20</span><span>BULL</span>
                </div>
            </div>

            <div class="oche-darts">
                <div class="oche-dart filled">T20</div>
                <div class="oche-dart">2</div>
                <div class="oche-dart">3</div>
                <div class="oche-turntotal"><small>TURN</small><b class="tnum">60</b></div>
            </div>

            <div class="oche-boardwrap"><svg id="board" viewBox="-190 -190 380 380"></svg></div>

            <div class="oche-quick">
                <button>26</button><button>40</button><button>41</button><button>45</button><button>60</button>
                <button>81</button><button>85</button><button>100</button><button>140</button><button>180</button>
            </div>
        </div>
    </div>

    <div class="oche-footer">
        <div class="oche-finish">TAP THE BOARD FOR EACH DART &middot; 2 DARTS LEFT</div>
        <div class="oche-actions">
            <button class="oche-btn undo">UNDO</button>
            <button class="oche-btn pad">123</button>
            <button class="oche-btn miss">MISS</button>
            <button class="oche-btn bust">BUST</button>
            <button class="oche-btn enter">ENTER 60</button>
        </div>
    </div>
</div>

<div class="proto-tag">Concept 1 &middot; Oche</div>

<script>
// Standard clockwise board order beginning at 20 (top).
const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

// Ring radii as a fraction of the 170-unit playing surface.
const R = { bullIn: 7, bullOut: 17, tripIn: 95, tripOut: 107, dblIn: 160, dblOut: 170 };

const pt = (r, deg) => {
    const a = (deg - 90) * Math.PI / 180;
    return [r * Math.cos(a), r * Math.sin(a)];
};

// Annular sector between two radii and two angles.
function sector(r0, r1, a0, a1) {
    const [x0, y0] = pt(r1, a0), [x1, y1] = pt(r1, a1);
    const [x2, y2] = pt(r0, a1), [x3, y3] = pt(r0, a0);
    return `M${x0} ${y0}A${r1} ${r1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 0 0 ${x3} ${y3}Z`;
}

const svg = document.getElementById('board');
const add = (d, cls) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', cls + ' seg-line');
    svg.appendChild(p);
};

// Wire ring backdrop.
const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
bg.setAttribute('r', 182);
bg.setAttribute('fill', '#111');
svg.appendChild(bg);

ORDER.forEach((num, i) => {
    const a0 = i * 18 - 9, a1 = i * 18 + 9;
    const alt = i % 2 === 0;
    add(sector(R.bullOut, R.tripIn, a0, a1), alt ? 'seg-single-a' : 'seg-single-b');
    add(sector(R.tripIn, R.tripOut, a0, a1), alt ? 'seg-mult-b' : 'seg-mult-a');
    add(sector(R.tripOut, R.dblIn, a0, a1), alt ? 'seg-single-a' : 'seg-single-b');
    add(sector(R.dblIn, R.dblOut, a0, a1), alt ? 'seg-mult-b' : 'seg-mult-a');

    const [tx, ty] = pt(177, i * 18);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', tx);
    t.setAttribute('y', ty);
    t.setAttribute('class', 'board-num');
    t.textContent = num;
    svg.appendChild(t);
});

['seg-mult-a', 'seg-mult-b'].forEach((cls, i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', i === 0 ? R.bullOut : R.bullIn);
    c.setAttribute('class', cls + ' seg-line');
    svg.appendChild(c);
});

// Highlight the dart already thrown this turn (T20).
const hl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
hl.setAttribute('d', sector(R.tripIn, R.tripOut, -9, 9));
hl.setAttribute('fill', 'none');
hl.setAttribute('stroke', '#00aaff');
hl.setAttribute('stroke-width', '4');
svg.appendChild(hl);

// --- Score tape ---
const L = [60, 81, 45, 26, 60, 59];
const M = [41, 60, 26, 'BUST', 45, 54];

const cell = (v, extra = '') => {
    let cls = 'oche-cell';
    if (v === 'BUST') cls += ' bust';
    if (v === 'MISS') cls += ' miss';
    return `<div class="${cls} ${extra}">${v}</div>`;
};

document.getElementById('laneL').innerHTML =
    L.map(v => cell(v)).join('') + cell('60', 'live');
document.getElementById('laneM').innerHTML =
    M.map(v => cell(v)).join('') + cell('&nbsp;');
document.getElementById('laneR').innerHTML =
    Array.from({ length: 7 }, (_, i) =>
        `<div class="oche-cell rd${i === 6 ? ' current' : ''}"><span>${i + 1}</span></div>`).join('');
</script>
</body>
</html>
